            path: "../agritrace-network/crypto-config/peerOrganizations/processor.agritrace.com/users/Admin@processor.agritrace.com/msp/keystore/priv_sk"
          clientSignedCert:
            path: "../agritrace-network/crypto-config/peerOrganizations/processor.agritrace.com/users/Admin@processor.agritrace.com/msp/signcerts/Admin@processor.agritrace.com-cert.pem"
    connectionProfile:
      path: "./networks/connectionProfile-processor.yaml"
      discover: false

  - mspid: RegulatorMSP
    identities:
      certificates:
        - name: "Admin"
          clientPrivateKey:
            path: "../agritrace-network/crypto-config/peerOrganizations/regulator.agritrace.com/users/Admin@regulator.agritrace.com/msp/keystore/priv_sk"
          clientSignedCert:
            path: "../agritrace-network/crypto-config/peerOrganizations/regulator.agritrace.com/users/Admin@regulator.agritrace.com/msp/signcerts/Admin@regulator.agritrace.com-cert.pem"
