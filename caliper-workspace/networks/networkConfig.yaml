name: AgriTrace Fabric Network
version: "2.0.0"
caliper:
  blockchain: fabric

channels:
  - channelName: agritracechannel
    contracts:
      - id: sc01-registration
      - id: sc02-certification
      - id: sc03-compliance
      - id: sc04-lc-settlement

organizations:
  - mspid: FarmerMSP
    identities:
      certificates:
        - name: "Admin"
          clientPrivateKey:
            path: "../agritrace-network/crypto-config/peerOrganizations/farmer.agritrace.com/users/Admin@farmer.agritrace.com/msp/keystore/priv_sk"
          clientSignedCert:
            path: "../agritrace-network/crypto-config/peerOrganizations/farmer.agritrace.com/users/Admin@farmer.agritrace.com/msp/signcerts/Admin@farmer.agritrace.com-cert.pem"
    connectionProfile:
      path: "./networks/connectionProfile-farmer.yaml"
      discover: false

  - mspid: AggregatorMSP
    identities:
      certificates:
        - name: "Admin"
          clientPrivateKey:
            path: "../agritrace-network/crypto-config/peerOrganizations/aggregator.agritrace.com/users/Admin@aggregator.agritrace.com/msp/keystore/priv_sk"
          clientSignedCert:
            path: "../agritrace-network/crypto-config/peerOrganizations/aggregator.agritrace.com/users/Admin@aggregator.agritrace.com/msp/signcerts/Admin@aggregator.agritrace.com-cert.pem"
    connectionProfile:
