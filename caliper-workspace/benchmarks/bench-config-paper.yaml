test:
  name: AgriTrace-ID Paper Benchmark
  description: Paper-ready benchmark for successful AgriTrace smart contract transactions on Hyperledger Fabric
  workers:
    number: 5
  rounds:
    - label: register-actor
      description: Register new actors (Farmer entities)
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/registerActor.js
        arguments:
          contractId: sc01-registration

    - label: register-batch
      description: Register new agricultural batches
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/registerBatch.js
        arguments:
          contractId: sc01-registration

    - label: issue-certificate
      description: Issue quality certificates (Regulator only)
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workloads/issueCertificate.js
        arguments:
          contractId: sc02-certification

    - label: record-compliance
      description: Record compliance checks during distribution
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workloads/recordCompliance.js
        arguments:
          contractId: sc03-compliance

    - label: issue-lc
      description: Issue Letter of Credit (Buyer only)
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workloads/issueLC.js
        arguments:
          contractId: sc04-lc-settlement

    - label: settle-lc
      description: Settle issued Letters of Credit (Buyer only)
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workloads/settleLC.js
        arguments:
          contractId: sc04-lc-settlement
