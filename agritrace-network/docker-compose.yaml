      - CORE_PEER_ADDRESS=peer0.farmer.agritrace.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.farmer.agritrace.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.farmer.agritrace.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.farmer.agritrace.com:7051
      - CORE_PEER_LOCALMSPID=FarmerMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb_farmer:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/farmer.agritrace.com/peers/peer0.farmer.agritrace.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/farmer.agritrace.com/peers/peer0.farmer.agritrace.com/tls:/etc/hyperledger/fabric/tls
